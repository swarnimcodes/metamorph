name: Release

# Publishes a GitHub release whenever the app version in app/src-tauri/tauri.conf.json changes on main, which is what
# a "Bump the version to ..." commit does. One version, one release: a signed Android APK and the Play bundle, the
# desktop installers (Linux AppImage, .deb and .rpm; Windows setup .exe), a checksum list for every file, and a
# changelog. When AUR_PUBLISH is "true" it also updates the AUR package metamorph-bin.
# It stays off until the repository variable AUTO_RELEASE is "true". Run it by hand from the Actions tab with
# "publish" turned off to check every build works on a runner without signing, releasing or publishing anything.

on:
  push:
    branches: [main]
    paths:
      - app/src-tauri/tauri.conf.json
  workflow_dispatch:
    inputs:
      publish:
        description: "Sign with the release key and publish a release (turn off to only test the build)"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check:
    name: Is there something to release?
    if: vars.AUTO_RELEASE == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.ver.outputs.version }}
      tag: ${{ steps.ver.outputs.tag }}
      publish: ${{ steps.ver.outputs.publish }}
      run: ${{ steps.ver.outputs.run }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-tags: true
      - id: ver
        env:
          PUBLISH: ${{ github.event_name != 'workflow_dispatch' || inputs.publish }}
        run: |
          version=$(jq -r .version app/src-tauri/tauri.conf.json)
          tag="v$version"
          exists=false
          git rev-parse -q --verify "refs/tags/$tag" >/dev/null && exists=true
          # Build when publishing a version that has no release yet, or on a test run (which publishes nothing).
          run=false
          if [ "$PUBLISH" = true ] && [ "$exists" = false ]; then run=true; fi
          if [ "$PUBLISH" = false ]; then run=true; fi
          if [ "$run" = false ]; then echo "::notice::$tag is already released; nothing to do"; fi
          {
            echo "version=$version"
            echo "tag=$tag"
            echo "publish=$PUBLISH"
            echo "run=$run"
          } >> "$GITHUB_OUTPUT"

  release:
    name: Build and publish
    needs: check
    if: needs.check.outputs.run == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    # Holds the signing key. Add required reviewers to this environment to approve each release.
    environment: release
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.check.outputs.version }}
      TAG: ${{ needs.check.outputs.tag }}
      PUBLISH: ${{ needs.check.outputs.publish }}
      PACKAGE: com.smarniw.metamorph
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the changelog reads the history since the last release

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-37.0 platforms;android-36 build-tools;37.0.0 ndk;30.0.14904198"
      - name: Point the Tauri build at the NDK
        run: echo "NDK_HOME=$ANDROID_HOME/ndk/30.0.14904198" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri
      - uses: pnpm/action-setup@v6
        with:
          version: 12
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - name: Install web dependencies
        working-directory: app
        run: pnpm install --frozen-lockfile

      - name: Google client id (the app is useless without sign-in)
        env:
          CLIENT_ID: ${{ vars.VITE_GOOGLE_CLIENT_ID }}
        run: |
          test -n "$CLIENT_ID" || { echo "the repository variable VITE_GOOGLE_CLIENT_ID is not set: the app would be built without Google sign-in"; exit 1; }
          echo "VITE_GOOGLE_CLIENT_ID=$CLIENT_ID" > app/.env.local

      - name: Signing key
        if: env.PUBLISH == 'true'
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ vars.ANDROID_KEY_ALIAS }}
        run: |
          test -n "$KEYSTORE_B64" && test -n "$KEYSTORE_PASSWORD" || { echo "ANDROID_KEYSTORE_B64 and ANDROID_KEYSTORE_PASSWORD must be set"; exit 1; }
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          {
            echo "MM_KEYSTORE=$RUNNER_TEMP/release.jks"
            echo "MM_KEY_ALIAS=${KEY_ALIAS:-metamorph}"
            printf 'MM_KEYSTORE_PASSWORD=%q\n' "$KEYSTORE_PASSWORD"
          } > "$RUNNER_TEMP/signing.env"
          chmod 600 "$RUNNER_TEMP/release.jks" "$RUNNER_TEMP/signing.env"
          echo "MM_SIGNING_ENV=$RUNNER_TEMP/signing.env" >> "$GITHUB_ENV"

      - name: Build and sign the APK and the Play bundle
        if: env.PUBLISH == 'true'
        run: |
          ./deploy/android-release.sh
          ./deploy/android-release.sh aab

      - name: Build the APK, unsigned (test run)
        if: env.PUBLISH != 'true'
        working-directory: app
        run: |
          pnpm tauri android build --apk --target aarch64
          mkdir -p ../deploy/out
          cp src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release-unsigned.apk ../deploy/out/Metamorph-unsigned.apk

      - name: Check what was built
        run: |
          apk=deploy/out/Metamorph.apk
          [ "$PUBLISH" = true ] || apk=deploy/out/Metamorph-unsigned.apk
          aapt2=$(ls -d "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -1)
          badging=$("$aapt2" dump badging "$apk")
          echo "$badging" | head -1
          echo "$badging" | grep -q "^package: name='$PACKAGE'" || { echo "unexpected package name"; exit 1; }
          echo "$badging" | grep -q "versionName='$VERSION'" || { echo "the APK's version is not $VERSION"; exit 1; }
          echo "$badging" | grep -q "native-code: 'arm64-v8a'" || { echo "no arm64 code in the APK"; exit 1; }

      - name: Write the release notes
        if: env.PUBLISH == 'true'
        run: |
          cert=$("$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)" verify --print-certs deploy/out/Metamorph.apk \
                 | sed -n 's/.*certificate SHA-256 digest: //p' | head -1)
          test -n "$cert" || { echo "could not read the signing certificate"; exit 1; }
          prev=$(git tag --list 'v*' --sort=-v:refname | head -1)
          echo "previous release: ${prev:-none}"
          CERT_SHA256="$cert" scripts/release-notes.sh "$VERSION" deploy/out/Metamorph.apk "$prev" HEAD > "$RUNNER_TEMP/notes.md"
          cat "$RUNNER_TEMP/notes.md"
          cp deploy/out/Metamorph.apk "$RUNNER_TEMP/Metamorph-$VERSION-arm64.apk"

      - name: Keep the Play bundle and the APK as workflow artifacts
        uses: actions/upload-artifact@v7
        with:
          name: android-${{ env.VERSION }}
          path: |
            deploy/out/*.apk
            deploy/out/*.aab
          retention-days: 30
          if-no-files-found: error

      - name: Publish the release
        if: env.PUBLISH == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=()
          [[ "$VERSION" == 0.* ]] && flags+=(--prerelease)
          title="Metamorph $VERSION"
          [[ "$VERSION" == 0.* ]] && title="$title (pre-release)"
          gh release create "$TAG" "$RUNNER_TEMP/Metamorph-$VERSION-arm64.apk" \
            --target "$GITHUB_SHA" --title "$title" --notes-file "$RUNNER_TEMP/notes.md" "${flags[@]}"

  # The desktop apps build in parallel with the Android one. They only leave workflow artifacts here: the "attach" job
  # below puts them on the release once the release exists, so a flaky desktop build never blocks the phone release.
  desktop:
    name: Desktop (${{ matrix.name }})
    needs: check
    if: needs.check.outputs.run == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    # Not in the "release" environment (which only main may use, to guard the Android signing key): the only secret here
    # is the desktop Google client's, which Google documents as not confidential for this client type, so it is a
    # plain repository secret and these jobs can also be tried from a branch.
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux, os: ubuntu-24.04 }
          - { name: windows, os: windows-latest }
    defaults:
      run:
        shell: bash
    env:
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - name: Linux build dependencies
        if: matrix.name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev \
            libssl-dev patchelf xdg-utils file rpm libfuse2t64

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri
          key: desktop-${{ matrix.name }}
      - uses: pnpm/action-setup@v6
        with:
          version: 12
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - name: Install web dependencies
        working-directory: app
        run: pnpm install --frozen-lockfile

      - name: Desktop Google client (the app signs in with it, through the browser)
        env:
          CLIENT_ID: ${{ vars.GOOGLE_DESKTOP_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.GOOGLE_DESKTOP_CLIENT_SECRET }}
        run: |
          if [ -z "$CLIENT_ID" ] || [ -z "$CLIENT_SECRET" ]; then
            echo "the repository variable GOOGLE_DESKTOP_CLIENT_ID and the repository secret GOOGLE_DESKTOP_CLIENT_SECRET must both be set: the desktop app would be built without Google sign-in"
            exit 1
          fi
          # The secret of a Desktop-type client is not confidential (Google says so) but it still stays out of git.
          {
            printf 'VITE_GOOGLE_DESKTOP_CLIENT_ID=%s\n' "$CLIENT_ID"
            printf 'VITE_GOOGLE_DESKTOP_CLIENT_SECRET=%s\n' "$CLIENT_SECRET"
          } > app/.env.desktop.local

      - name: Build the installers
        working-directory: app
        env:
          NO_STRIP: "true" # linuxdeploy's bundled strip chokes on newer toolchains
        run: pnpm tauri build

      - name: Name the files
        run: |
          out=desktop-out
          bundle=app/src-tauri/target/release/bundle
          mkdir -p "$out"
          if [ "${{ matrix.name }}" = linux ]; then
            cp "$bundle"/deb/*.deb "$out/Metamorph-$VERSION-linux-amd64.deb"
            cp "$bundle"/rpm/*.rpm "$out/Metamorph-$VERSION-linux-x86_64.rpm"
            cp "$bundle"/appimage/*.AppImage "$out/Metamorph-$VERSION-linux-x86_64.AppImage"
          else
            cp "$bundle"/nsis/*-setup.exe "$out/Metamorph-$VERSION-windows-x64-setup.exe"
          fi
          ls -l "$out"

      - name: Check the Linux packages
        if: matrix.name == 'linux'
        run: |
          deb="desktop-out/Metamorph-$VERSION-linux-amd64.deb"
          dpkg-deb -f "$deb" Package Version Depends
          [ "$(dpkg-deb -f "$deb" Package)" = metamorph ] || { echo "unexpected package name"; exit 1; }
          [ "$(dpkg-deb -f "$deb" Version)" = "$VERSION" ] || { echo "the package version is not $VERSION"; exit 1; }
          dpkg-deb -c "$deb" | grep -qE ' (\./)?usr/bin/metamorph$' || { echo "no /usr/bin/metamorph in the package"; exit 1; }

      - uses: actions/upload-artifact@v7
        with:
          name: desktop-${{ matrix.name }}-${{ env.VERSION }}
          path: desktop-out/*
          retention-days: 30
          if-no-files-found: error

  attach:
    name: Attach the desktop apps and checksums
    needs: [check, release, desktop]
    if: needs.check.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      VERSION: ${{ needs.check.outputs.version }}
      TAG: ${{ needs.check.outputs.tag }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: desktop-*-${{ env.VERSION }}
          path: desktop
          merge-multiple: true
      - name: Put the desktop files on the release
        run: |
          ls -l desktop
          gh release upload "$TAG" desktop/* --clobber
      - name: Checksums of every file on the release
        run: |
          mkdir all
          gh release download "$TAG" --dir all
          rm -f all/SHA256SUMS.txt
          (cd all && sha256sum -- * > SHA256SUMS.txt && cat SHA256SUMS.txt)
          gh release upload "$TAG" all/SHA256SUMS.txt --clobber

  aur:
    name: Update the AUR package
    needs: [check, attach]
    # Off until the AUR repository exists and the secret is set (see deploy/README.md).
    if: needs.check.outputs.publish == 'true' && vars.AUR_PUBLISH == 'true'
    runs-on: ubuntu-24.04
    environment: release # holds AUR_SSH_KEY
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.check.outputs.tag }}
      - name: Set the version
        env:
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          sed -i "s/^pkgver=.*/pkgver=$VERSION/; s/^pkgrel=.*/pkgrel=1/" deploy/aur/PKGBUILD
          grep -E '^pkg(ver|rel)=' deploy/aur/PKGBUILD
      # Pinned to a commit, not a tag: this action receives the AUR private key.
      - uses: KSXGitHub/github-actions-deploy-aur@084b0d9b15415bf9cdb65d44dad1efe37a354050 # v4.2.0
        with:
          pkgname: metamorph-bin
          pkgbuild: deploy/aur/PKGBUILD
          updpkgsums: true
          test: true
          commit_username: ${{ vars.AUR_COMMIT_NAME }}
          commit_email: ${{ vars.AUR_COMMIT_EMAIL }}
          ssh_private_key: ${{ secrets.AUR_SSH_KEY }}
          commit_message: Update to ${{ needs.check.outputs.version }}
